services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: scout
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
    ports:
      - "5432:5432"
    volumes:
      - scout_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Use the compose service by default; override for an external database.
      DATABASE_URL: ${SCOUT_DATABASE_URL:-postgresql+psycopg://scout:scout@db:5432/scout}
      PORT: "10000"
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    ports:
      - "8000:10000"

volumes:
  scout_postgres_data:
