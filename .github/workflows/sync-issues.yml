name: Sync GitHub issues

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_issues_per_repo:
        description: Optional cap for issues fetched from each repository
        required: false
        type: number

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check database secret
        id: database
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL is not configured; skipping scheduled Scout sync."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.database.outputs.configured == 'true'
      - uses: actions/setup-python@v5
        if: steps.database.outputs.configured == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache ONNX models
        if: steps.database.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ runner.os }}-${{ hashFiles('backend/app/core/config.py') }}
      - name: Install Scout
        if: steps.database.outputs.configured == 'true'
        run: pip install .
      - name: Apply migrations
        if: steps.database.outputs.configured == 'true'
        run: alembic -c backend/alembic.ini upgrade head
      - name: Sync curated repositories
        if: steps.database.outputs.configured == 'true'
        env:
          MAX_ISSUES_PER_REPO: ${{ inputs.max_issues_per_repo }}
        run: |
          if [[ -n "$MAX_ISSUES_PER_REPO" ]]; then
            python -m app.ingestion.cli sync --max-issues "$MAX_ISSUES_PER_REPO"
          else
            python -m app.ingestion.cli sync --max-issues 60
          fi
      - name: Prune stale data
        if: steps.database.outputs.configured == 'true'
        run: python -m app.ingestion.cli prune
