name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: scout
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout -d scout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://scout:scout@localhost:5432/scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache ONNX embedding model
        uses: actions/cache@v6
        with:
          path: .cache/fastembed
          key: fastembed-${{ runner.os }}-${{ hashFiles('backend/app/core/config.py') }}
      - name: Install project and development dependencies
        run: pip install -e ".[dev]"
      - name: Lint and check formatting
        run: |
          ruff check backend
          ruff format --check backend
      - name: Type check
        run: mypy backend/app backend/evals
      - name: Apply database migrations
        run: alembic -c backend/alembic.ini upgrade head
      - name: Run tests
        run: pytest -v
      - name: Evaluate retrieval quality
        run: python -m backend.evals.run_retrieval_evals --embedder fastembed
      - name: Evaluate conversational agent
        run: python -m backend.evals.run_agent_evals --mode deterministic

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t scout:ci .
      - name: Verify app imports and PyTorch is absent
        run: >-
          docker run --rm --entrypoint python scout:ci -c
          "import importlib.util; from app.main import create_app; app = create_app(); assert app is not None; assert importlib.util.find_spec('torch') is None"
